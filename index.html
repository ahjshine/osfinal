<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell and C Code Reference</title>
<style>
:root {
  --bg: #ffffff;
  --panel: #f6f5f4;
  --panel-2: #eeeeec;
  --border: #d3d7cf;
  --text: #2e3436;
  --muted: #6b7075;
  --accent: #3584e4;
  --accent-text: #ffffff;
  --gutter: #eeeeec;
  --gutter-text: #888a85;
  --line-hl: #eeeeec;
  --hit: #fce94f55;
  --c-kw: #a40000;
  --c-com: #3465a4;
  --c-str: #ad7fa8;
  --c-num: #ad7fa8;
  --c-type: #4e9a06;
  --c-var: #c4a000;
  --shadow: 0 1px 2px rgba(0,0,0,.08);
}
:root[data-theme="dark"] {
  --bg: #2e3436;
  --panel: #353b3d;
  --panel-2: #2a2f31;
  --border: #4a5154;
  --text: #eeeeec;
  --muted: #a3a8a6;
  --accent: #3584e4;
  --accent-text: #ffffff;
  --gutter: #3a4143;
  --gutter-text: #8b918f;
  --line-hl: #3a4143;
  --hit: #c4a00040;
  --c-kw: #ef2929;
  --c-com: #729fcf;
  --c-str: #ad7fa8;
  --c-num: #ad7fa8;
  --c-type: #8ae234;
  --c-var: #fce94f;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Cantarell, sans-serif;
  line-height: 1.5;
}
/* Top bar */
header {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  z-index: 20;
}
header h1 { font-size: 16px; margin: 0; white-space: nowrap; font-weight: 600; }
.search { flex: 1; max-width: 460px; position: relative; }
.search input {
  width: 100%; height: 36px; padding: 0 12px 0 34px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 14px;
  outline: none;
}
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #3584e455; }
.search svg { position: absolute; left: 10px; top: 10px; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.spacer { flex: 1; }
button {
  font: inherit; font-size: 13px; cursor: pointer;
  height: 34px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text);
}
button:hover { background: var(--panel-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.primary:hover { filter: brightness(1.1); }
#menu { display: none; padding: 0 10px; }
/* Sidebar */
aside {
  position: fixed; top: 60px; left: 0; bottom: 0; width: 270px;
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px 8px 24px;
  z-index: 10;
}
aside h2 {
  font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 14px 10px 6px;
}
aside a {
  display: block; padding: 7px 10px; margin: 1px 0;
  border-radius: 6px; color: var(--text); text-decoration: none; font-size: 14px;
}
aside a:hover { background: var(--panel-2); }
aside a.active { background: var(--accent); color: var(--accent-text); }
aside a.hidden { display: none; }
/* ===== File browser sidebar (gedit style) ===== */
:root { --fb-head: #ebebea; --fb-sel: #3584e4; --fb-sel-text: #fff; --fb-hover: #00000010; --fb-btn: #e1e1df; --fb-btn-border: #cdcdca; --fb-icon: #5e5c64; }
:root[data-theme="dark"] { --fb-head: #323638; --fb-sel: #3584e4; --fb-sel-text: #fff; --fb-hover: #ffffff12; --fb-btn: #3d4345; --fb-btn-border: #50575a; --fb-icon: #deddda; }
aside { padding: 0; display: flex; flex-direction: column; width: 270px; border-right: 1px solid var(--border); background: var(--bg); }
.fb-title {
  flex: none; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--fb-head); font-weight: 700; font-size: 14px; border-bottom: 1px solid var(--border);
}
.chev { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fb-nav {
  flex: none; display: flex; gap: 6px; align-items: center; padding: 6px 8px;
  background: var(--fb-head); border-bottom: 1px solid var(--border);
}
.fb-nav button {
  height: 30px; min-width: 32px; padding: 0 8px; background: var(--fb-btn);
  border: 1px solid var(--fb-btn-border); border-radius: 6px; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.fb-nav button:hover { filter: brightness(.96); background: var(--fb-btn); }
.fb-nav svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fb-nav .seg { display: inline-flex; }
.fb-nav .seg button:first-child { border-radius: 6px 0 0 6px; }
.fb-nav .seg button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
.fb-nav .root { flex: 1; justify-content: space-between; font-size: 14px; min-width: 0; }
.fb-nav .root span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: center; }
#tree { flex: 1; overflow: auto; padding: 4px 0 20px; font-size: 14px; user-select: none; }
#tree .row, #tree a {
  display: flex; align-items: center; gap: 6px; height: 28px;
  padding: 0 10px 0 6px; margin: 0; border-radius: 0; color: var(--text);
  text-decoration: none; white-space: nowrap; cursor: default;
}
#tree .row:hover, #tree a:hover { background: var(--fb-hover); }
#tree a.active, #tree a.active:hover { background: var(--fb-sel); color: var(--fb-sel-text); }
#tree a { padding-left: 38px; }
#tree a span { overflow: hidden; text-overflow: ellipsis; }
#tree a.hidden { display: none; }
#tree .arrow { width: 14px; height: 14px; flex: none; fill: none; stroke: var(--fb-icon); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .12s; }
#tree .folder.collapsed .arrow { transform: rotate(-90deg); }
#tree .folder.collapsed .kids { display: none; }
#tree .ico { width: 18px; height: 18px; flex: none; }
#tree .row { cursor: pointer; }
/* Main */
main { margin-left: 270px; padding: 84px 28px 60px; max-width: 1100px; }
.group-title { font-size: 22px; margin: 30px 0 10px; }
.group-title:first-child { margin-top: 0; }
.run {
  background: var(--panel); border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 6px; padding: 10px 14px; margin: 0 0 22px; font-size: 14px;
}
.run b { display: block; margin-bottom: 4px; }
.run code { font-family: ui-monospace, "Source Code Pro", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
.run div { font-family: ui-monospace, "Source Code Pro", "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 13px; }
/* Code cards, editor-like */
.card {
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  margin: 0 0 28px; background: var(--bg); box-shadow: var(--shadow);
}
.card.hidden { display: none; }
.card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.card-head h3 { font-size: 15px; margin: 0; flex: 1; font-weight: 600; }
.badge {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
}
.code-wrap { overflow-x: auto; }
.code {
  margin: 0; padding: 6px 0;
  font-family: ui-monospace, "Source Code Pro", "DejaVu Sans Mono", Menlo, Consolas, monospace;
  font-size: 13.5px; line-height: 1.55;
  counter-reset: ln;
  min-width: max-content;
}
.line { display: block; white-space: pre; padding-right: 16px; min-height: 1.55em; }
.line::before {
  counter-increment: ln; content: counter(ln);
  display: inline-block; width: 4.2ch; text-align: right;
  padding-right: 10px; margin-right: 12px;
  color: var(--gutter-text); background: var(--gutter);
  position: sticky; left: 0;
  user-select: none;
}
.line:hover { background: var(--line-hl); }
.line.hit { background: var(--hit); }
.statusbar {
  display: flex; justify-content: flex-end; gap: 18px;
  padding: 4px 12px; font-size: 12px; color: var(--muted);
  background: var(--panel); border-top: 1px solid var(--border);
}
.k { color: var(--c-kw); font-weight: 700; }
.c { color: var(--c-com); }
.s { color: var(--c-str); }
.n { color: var(--c-num); }
.t { color: var(--c-type); font-weight: 700; }
.v { color: var(--c-var); }
#empty { display: none; padding: 40px; text-align: center; color: var(--muted); }
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #2e3436; color: #fff; padding: 10px 16px; border-radius: 6px;
  font-size: 14px; opacity: 0; transform: translateY(10px);
  transition: all .2s; pointer-events: none; z-index: 50;
}
#toast.show { opacity: 1; transform: none; }
@media (max-width: 800px) {
  #menu { display: inline-block; }
  header h1 { display: none; }
  aside { transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 8px rgba(0,0,0,.2); }
  aside.open { transform: none; }
  main { margin-left: 0; padding: 80px 12px 40px; }
  button .lbl { display: none; }
}
/* ===== Single editor view (gedit style) ===== */
html, body { height: 100%; overflow: hidden; }
main { margin-left: 270px; max-width: none; padding: 60px 0 0; height: 100vh; display: flex; flex-direction: column; }
.group-title, .run { display: none !important; }
#empty { padding: 60px 20px; }
.card {
  display: none; flex: 1; min-height: 0; flex-direction: column;
  margin: 0; border: 0; border-radius: 0; box-shadow: none; background: var(--bg);
}
.card.current { display: flex; }
.card-head {
  flex: none; height: 40px; padding: 0 6px 0 0; gap: 0;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
.card-head h3 {
  flex: 1; height: 40px; line-height: 37px; margin: 0;
  text-align: center; font-size: 14px; font-weight: 400;
  border-bottom: 3px solid var(--accent); background: var(--panel-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-head .badge { display: none; }
.card-head button { height: 28px; margin-left: 8px; font-size: 13px; padding: 0 12px; }
.code-wrap { flex: 1; min-height: 0; overflow: auto; position: relative; }
.code { padding: 0; font-size: 15px; line-height: 23px; min-height: 100%; }
.line { min-height: 23px; padding-right: 24px; cursor: text; }
.line:hover { background: transparent; }
.line.hit { background: var(--hit); }
.line.cur, .line.cur.hit { background: var(--line-hl); }
.line::before { width: 4ch; padding-right: 6px; margin-right: 5px; background: var(--gutter); }
.statusbar {
  flex: none; height: 28px; padding: 0; gap: 0; align-items: center; justify-content: flex-start;
  font-size: 13px; color: var(--text); background: var(--bg); border-top: 1px solid var(--border);
}
.statusbar span { padding: 0 12px; white-space: nowrap; }
.statusbar .run-info {
  margin-right: auto; color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0;
  font-family: ui-monospace, "Source Code Pro", "DejaVu Sans Mono", Menlo, Consolas, monospace; font-size: 12.5px;
}
@media (max-width: 800px) { main { margin-left: 0; padding: 60px 0 0; } .statusbar .tw { display: none; } }
/* ===== Header like gedit headerbar ===== */
:root { --hdr: #e8e8e6; --hbtn: #f6f5f4; --hbtn-border: #cdcdca; }
:root[data-theme="dark"] { --hdr: #353b3d; --hbtn: #3f4647; --hbtn-border: #52595b; }
header {
  height: 50px; padding: 0; gap: 0; align-items: stretch;
  background: var(--hdr); border-bottom: 1px solid var(--border);
}
.hb-left {
  width: 270px; flex: none; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 700; font-size: 14px; border-right: 1px solid var(--border);
}
.hb-right { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 8px 0 10px; }
.hb-group { display: flex; align-items: center; gap: 8px; flex: none; }
.hb-right button {
  height: 34px; padding: 0 16px; font-size: 14px; background: var(--hbtn);
  border: 1px solid var(--hbtn-border); border-radius: 6px; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
}
.hb-right button:hover { filter: brightness(.97); background: var(--hbtn); }
.hb-right .sq { width: 36px; padding: 0; }
.hb-right .x { border: 0; background: transparent; width: 32px; padding: 0; }
.hb-right .x:hover { background: var(--fb-hover); }
.hb-right svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.split { display: inline-flex; }
.split button:first-child { border-radius: 6px 0 0 6px; }
.split .arrow { border-radius: 0 6px 6px 0; border-left: 0; padding: 0 9px; }
.hb-title { flex: 1; min-width: 0; text-align: center; line-height: 1.25; }
.hb-title b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-title small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-wrap { position: relative; }
.pop {
  position: absolute; right: 0; top: 42px; min-width: 200px; padding: 6px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 40;
}
.pop[hidden] { display: none; }
.hb-right .pop button {
  width: 100%; height: 32px; justify-content: space-between; padding: 0 10px;
  background: transparent; border: 0; border-radius: 6px; font-size: 14px;
}
.hb-right .pop button:hover { background: var(--fb-hover); filter: none; }
.pop .tick { visibility: hidden; color: var(--accent); }
.pop button.on .tick { visibility: visible; }
.pop .sep { height: 1px; background: var(--border); margin: 5px 4px; }
/* sidebar header row + search */
aside { top: 50px; }
.fb-nav { height: 44px; padding: 0 8px; background: var(--hdr); }
.fb-search { flex: 1; min-width: 0; position: relative; }
.fb-search svg { position: absolute; left: 8px; top: 8px; width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
.fb-search input {
  width: 100%; height: 30px; padding: 0 8px 0 27px; font-size: 14px;
  background: var(--bg); color: var(--text); border: 1px solid var(--fb-btn-border);
  border-radius: 6px; outline: none;
}
.fb-search input:focus { border-color: var(--accent); }
/* tab bar: no blue */
main { padding-top: 50px; }
.card-head { height: 44px; background: var(--hdr); border-bottom: 1px solid var(--border); padding: 0; }
.card-head h3 { height: 44px; line-height: 44px; border-bottom: 0; background: var(--hdr); }
body.sb-hidden aside { display: none; }
body.sb-hidden main { margin-left: 0; }
@media (max-width: 800px) {
  .hb-left, .hb-title small, #openBtn, #openArrow { display: none; }
  .hb-title b { text-align: center; }
  main { padding-top: 50px; }
}
/* ===== Find box ===== */
mark.m { background: #fce94f99; color: inherit; padding: 0; border-radius: 2px; }
mark.m.cur { background: #f57900; color: #fff; outline: 2px solid #f5790066; }
#findBox {
  position: fixed; top: 106px; right: 24px; width: 352px; max-width: calc(100vw - 24px);
  padding: 10px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.22); z-index: 30;
}
#findBox[hidden] { display: none; }
.fx-row { display: flex; align-items: center; gap: 8px; }
.fx-in { flex: 1; min-width: 0; position: relative; }
.fx-in svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
.fx-in input {
  width: 100%; height: 32px; padding: 0 8px 0 29px; font-size: 14px;
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 5px; outline: none;
}
.fx-in input:focus { border-color: var(--accent); }
.fx-seg { display: inline-flex; flex: none; }
#findBox button {
  height: 32px; width: 34px; padding: 0; background: var(--hbtn); color: var(--text);
  border: 1px solid var(--hbtn-border); display: inline-flex; align-items: center; justify-content: center;
}
#findBox button:hover { filter: brightness(.96); background: var(--hbtn); }
#findBox button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#findPrev { border-radius: 6px 0 0 6px; }
#findNext { border-radius: 0 6px 6px 0; border-left: 0; }
#findBox .fx-x { border: 0; background: transparent; width: 28px; border-radius: 6px; flex: none; }
#findBox .fx-x:hover { background: var(--fb-hover); }
.fx-count { margin-top: 8px; padding-left: 2px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="hb-left"><span>File Browser</span><svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></div>
  <div class="hb-right">
    <div class="hb-group">
      <div class="split">
        <button id="openBtn" title="Search programs">Open</button>
        <button id="openArrow" class="arrow" title="Expand / collapse all folders" aria-label="Expand or collapse folders"><svg class="chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
      </div>
      <button id="sidebarBtn" class="sq" title="Show / hide sidebar" aria-label="Toggle sidebar"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    </div>
    <div class="hb-title"><b id="hbName"></b><small id="hbPath"></small></div>
    <div class="hb-group">
      <button id="saveBtn" title="Download this program as a file">Save</button>
      <div class="menu-wrap">
        <button id="menuBtn" class="sq" title="Menu" aria-label="Menu"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
        <div id="menuPop" class="pop" hidden>
          <button data-act="theme" data-theme-opt="light"><span>Light mode</span><span class="tick">&#10003;</span></button>
          <button data-act="theme" data-theme-opt="dark"><span>Dark mode</span><span class="tick">&#10003;</span></button>
          <div class="sep"></div>
          <button data-act="copy"><span>Copy code</span></button>
          <button data-act="copyall"><span>Copy all codes</span></button>
        </div>
      </div>
      <button id="closeBtn" class="x" title="Reset view" aria-label="Reset view"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
  </div>
</header>

<aside id="side">
  <div class="fb-nav">
    <div class="seg">
      <button id="navBack" title="Previous" aria-label="Previous"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
      <button id="navFwd" title="Next" aria-label="Next"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
    </div>
    <button id="navUp" class="up" title="Back to top" aria-label="Back to top"><svg viewBox="0 0 16 16"><path d="M3 10l5-5 5 5"/></svg></button>
    <div class="fb-search">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search programs">
    </div>
  </div>
  <div id="tree"></div>
</aside>

<main id="main">
  <div id="empty">No programs match your search.</div>
</main>

<div id="findBox" hidden role="search" aria-label="Find in programs">
  <div class="fx-row">
    <div class="fx-in">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="findInput" type="search" placeholder="Search..." autocomplete="off" aria-label="Search keyword">
    </div>
    <div class="fx-seg">
      <button id="findPrev" title="Previous match (Shift+Enter)" aria-label="Previous match"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
      <button id="findNext" title="Next match (Enter)" aria-label="Next match"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
    </div>
    <button id="findClose" class="fx-x" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div id="findCount" class="fx-count"></div>
</div>

<div id="toast"></div>

<!-- ================= SHELL SCRIPTS ================= -->

<script type="text/plain" data-group="Shell Scripts" data-lang="bash" data-title="1. Basic Linux Commands">
#!/bin/bash

echo "===== BASIC LINUX COMMANDS ====="

WORK="$HOME/shell_demo"
mkdir -p "$WORK"
cd "$WORK" || exit 1

echo "Current directory:"
pwd

echo "List files:"
ls

echo "Change directory:"
cd ..
pwd
cd "$WORK" || exit 1

echo "Create and remove directory:"
mkdir -p shine
ls -d shine
rmdir shine
mkdir shine
cd shine || exit 1

echo "===== FILE CREATION ====="

<script type="text/plain" data-group="Shell Scripts" data-lang="bash" data-title="2. File Operations">
#!/bin/bash

echo "===== FILE OPERATIONS ====="

read -r -p "Enter filename: " filename

if [ -z "$filename" ]; then
    echo "Filename cannot be empty."
    exit 1
fi

if [ -e "$filename" ]; then
    read -r -p "File exists. Overwrite? (y/n): " ans
    if [ "$ans" != "y" ] && [ "$ans" != "Y" ]; then
        exit 0
    fi
fi

touch -- "$filename" || exit 1

echo "File created successfully."

echo "Enter file contents:"
echo "Press Ctrl+D on a new line to finish."

cat > "$filename"

echo "===== FILE CONTENTS ====="
cat -- "$filename"

echo "===== WORD COUNT ====="
wc -w -- "$filename"

echo "===== LINE COUNT ====="
wc -l -- "$filename"

echo "===== CHARACTER COUNT ====="
wc -m -- "$filename"

echo "===== BYTE COUNT ====="
wc -c -- "$filename"

echo "===== SORTED CONTENT ====="
sort -- "$filename"

echo "===== REVERSE SORT ====="
sort -r -- "$filename"

echo "===== UPPERCASE ====="
tr '[:lower:]' '[:upper:]' < "$filename"

echo "===== DISPLAY FIRST N LINES ====="

read -r -p "Enter number of lines: " n

if [[ "$n" =~ ^[0-9]+$ ]]; then
    head -n "$n" -- "$filename"
else
    echo "Invalid number."
fi

echo "===== SEARCH KEYWORD ====="

read -r -p "Enter keyword: " keyword

if [ -n "$keyword" ]; then
    grep -nF -- "$keyword" "$filename" || echo "No match found."
fi

echo "===== RENAME FILE ====="

read -r -p "Enter new filename (blank to skip): " newname

if [ -n "$newname" ]; then
    if [ -e "$newname" ]; then
        echo "Target already exists. Rename skipped."
    elif mv -- "$filename" "$newname"; then
        filename="$newname"
        echo "File renamed successfully."
    fi
fi

echo "===== EXTRACT CHARACTERS ====="

read -r -p "Enter starting position: " start
read -r -p "Enter ending position: " end

if [[ "$start" =~ ^[1-9][0-9]*$ &&
      "$end" =~ ^[1-9][0-9]*$ ]] &&
   (( start <= end )); then
    cut -c "$start-$end" -- "$filename"
else
    echo "Invalid range."
fi

echo "===== DELETE FILE ====="

read -r -p "Delete file? (y/n): " choice

if [ "$choice" = "y" ] || [ "$choice" = "Y" ]; then
    rm -- "$filename"
    echo "File deleted."
else
    echo "File not deleted."
fi
</script>

if ! command -v bc >/dev/null 2>&1; then
    echo "Install bc first: sudo apt install bc"

    echo "Integer division = $((a/b))"
    echo "Remainder = $((a%b))"

    echo "Decimal division:"
    echo "scale=2; $a/$b" | bc

    echo "Using expr:"

    expr "$a" \* "$b"
    expr "$a" % "$b"

pi=3.14159

echo "HRA = $hra"
echo "Gross Salary = $gross"

echo "===== EVEN OR ODD ====="

read -r -p "Enter a number: " n

if ! [[ "$n" =~ ^-?[0-9]+$ ]]; then
    echo "Invalid integer."
    exit 1
fi

if (( n % 2 == 0 )); then
    echo "$n is Even"
else

if (( x >= y && x >= z )); then

else

if ! [[ "$yr" =~ ^[0-9]+$ ]] || (( yr < 1 )); then

if (( yr % 400 == 0 ||
      (yr % 4 == 0 && yr % 100 != 0) )); then
    echo "$yr is a Leap Year"

<script type="text/plain" data-group="Shell Scripts" data-lang="bash" data-title="5. for Loop: Patterns, Chessboard, Wages and Factorial">
#!/bin/bash

echo "===== FOR LOOP PROGRAMS ====="

read -r -p "Enter number of rows: " n

if ! [[ "$n" =~ ^[1-9][0-9]*$ ]]; then
    echo "Enter a positive integer."
    exit 1
fi

echo "===== RIGHT TRIANGLE ====="

for ((i=1; i<=n; i++)); do
    for ((j=1; j<=i; j++)); do
        printf "*"
    done
    echo
done

echo "===== INVERTED TRIANGLE ====="

for ((i=n; i>=1; i--)); do
    for ((j=1; j<=i; j++)); do
        printf "*"
    done
    echo
done

echo "===== FULL DIAMOND ====="

for ((i=1; i<=n; i++)); do
    for ((s=i; s<n; s++)); do
        printf " "
    done

    for ((j=1; j<=2*i-1; j++)); do
        printf "*"
    done
    echo
done

for ((i=n-1; i>=1; i--)); do
    for ((s=i; s<n; s++)); do
        printf " "
    done

    for ((j=1; j<=2*i-1; j++)); do
        printf "*"
    done
    echo
done

echo "===== CHESSBOARD ====="

for ((r=0; r<8; r++)); do
    for ((c=0; c<8; c++)); do
        if (( (r+c)%2 == 0 )); then
            printf "\033[47m  "
        else
            printf "\033[40m  "
        fi
    done
    printf "\033[0m\n"
done

echo "===== WEEKLY WAGES ====="

d=1
total=0

for day in Mon Tue Wed Thu Fri Sat Sun; do
    if (( d <= 5 )); then
        wage=350
        echo "Day $d: $day (Weekday) = $wage"
    else
        wage=550
        echo "Day $d: $day (Weekend) = $wage"

    total=$((total+wage))

echo "Total weekly wage = $total"

if ! [[ "$f" =~ ^[0-9]+$ ]] || (( f > 20 )); then

fi

fact=1

for ((i=2; i<=f; i++)); do

for x in {1..5}; do

<script type="text/plain" data-group="Shell Scripts" data-lang="bash" data-title="6. while and until Loops">
#!/bin/bash

echo "===== WHILE AND UNTIL LOOPS ====="

read -r -p "Enter positive integer N: " N

if ! [[ "$N" =~ ^[1-9][0-9]*$ ]]; then
    echo "Invalid number."
    exit 1
fi

echo "===== SUM 1 TO N USING UNTIL ====="

i=1
sum=0

until (( i > N )); do
    sum=$((sum+i))
    i=$((i+1))
done

echo "Sum = $sum"

echo "===== REVERSE NUMBER PATTERN ====="

r=$N

until (( r < 1 )); do
    c=1

    until (( c > r )); do
        printf "%d" "$c"
        c=$((c+1))
    done

    echo
    r=$((r-1))
done

echo "===== EVEN AND ODD SUMS ====="

i=1
even=0
odd=0

while (( i <= N )); do
    if (( i % 2 == 0 )); then
        even=$((even+i))
    else
        odd=$((odd+i))
    fi

    i=$((i+1))
done

echo "Sum of even numbers = $even"
echo "Sum of odd numbers = $odd"

echo "===== REPEATED NUMBER PATTERN ====="

i=1

while (( i <= N )); do
    j=1

    while (( j <= i )); do
        printf "%d" "$i"
        j=$((j+1))
    done

    echo
    i=$((i+1))
done

echo "===== PALINDROMIC NUMBER PATTERN ====="

i=1

until (( i > N )); do
    j=1

    until (( j > i )); do
        printf "%d" "$j"
        j=$((j+1))
    done

    j=$((i-1))

    until (( j < 1 )); do
        printf "%d" "$j"
        j=$((j-1))
    done

    echo
    i=$((i+1))
done

echo "===== LARGEST AND SMALLEST DIGIT ====="

read -r -p "Enter a nonnegative integer: " num

if ! [[ "$num" =~ ^[0-9]+$ ]]; then
    echo "Invalid number."
    exit 1
fi

t=$num
big=0
small=9

if (( t == 0 )); then
    small=0
fi

while (( t > 0 )); do
    d=$((t%10))

    if (( d > big )); then
        big=$d
    fi

    if (( d < small )); then
        small=$d
    fi

    t=$((t/10))
done

echo "Largest digit = $big"
echo "Smallest digit = $small"

echo "===== PRIME NUMBER CHECK ====="

read -r -p "Enter number: " p

if ! [[ "$p" =~ ^[0-9]+$ ]]; then
    echo "Invalid number."
    exit 1
fi

prime=1

if (( p < 2 )); then
    prime=0
else
    k=2

    until (( k*k > p )); do
        if (( p % k == 0 )); then
            prime=0
            break
        fi

        k=$((k+1))
    done
fi

if (( prime == 1 )); then
    echo "$p is a Prime Number"
else
    echo "$p is Not a Prime Number"
fi

echo "===== READ FILE LINE BY LINE ====="

printf "line1\nline2\nline3\n" > temp_lab.txt

while IFS= read -r line; do
    echo "Read: $line"
done < temp_lab.txt

rm temp_lab.txt

echo "===== CONTINUE STATEMENT ====="

for n in 1 2 3 4 5 6; do
    if (( n % 2 == 0 )); then
        continue
    fi

    printf "odd:%d " "$n"
done

echo
</script>

<script type="text/plain" data-group="C Programs (Input)" data-lang="c" data-title="1. LRU Page Replacement (User Input)">
#include <stdio.h>

#define MAX_FRAMES 10  // Max frames array can hold
#define MAX_REFS 100   // Max page reference string length

void lru_page_replacement(int pages[], int n, int capacity) {

    // VARIABLE DECLARE

    // declare all tracking arrays for frames and access timestamps
    int frames[MAX_FRAMES];      // Stores page numbers currently loaded in memory
    int last_used[MAX_FRAMES];   // Stores the timestamp/time of last access for each frame

    // declare all variables that track progress and statistics
    int frame_count = 0;         // Number of currently occupied frames
    int page_faults = 0;         // Total page fault counter
    int page_hits = 0;           // Total page hit counter

    // Initialize all frames and timestamps to -1 (meaning empty)
    for (int i = 0; i < capacity; i++) {
        frames[i] = -1;
        last_used[i] = -1;
    }

    // ------------------------------------------

    // PRINT TABLE HEADER
  // Print table header cleanly
    printf("\nStep\tPage\t");
    for (int i = 0; i < capacity; i++) {
        printf("F%d\t", i + 1);
    }
    printf("Status\tEvicted\n");
    printf("-------------------------------------------------------------------\n");
    // ------------------------------------------

    // SIMULATION LOOP: Process each page reference step-by-step over time
    for (int time = 0; time < n; time++) {
        int page = pages[time];       // Current page being referenced
        int pos = -1;                 // Position if found in frames (-1 means not found)
        int is_hit = 0;               // Flag for hit (1) or fault (0)
        int replaced_page = -1;       // Tracks which page was evicted during a fault

        // CHECK IF PAGE IS ALREADY IN MEMORY (PAGE HIT)
        for (int j = 0; j < frame_count; j++) {
            if (frames[j] == page) {
                pos = j;
                break;
            }
        }

        // HANDLE HIT OR FAULT
        if (pos != -1) {
            // PAGE HIT: Page is already in memory, update its last used timestamp
            last_used[pos] = time;
            page_hits++;
            is_hit = 1;
        } else {
            // PAGE FAULT: Page is not in memory, needs to be brought in
            page_faults++;

            // Case A: There is still an empty frame available
            if (frame_count < capacity) {
                frames[frame_count] = page;
                last_used[frame_count] = time;
                frame_count++;
            } 
            // Case B: Memory is full, must replace Least Recently Used (LRU) page
            else {
                // Find frame with the smallest last_used time (oldest access)
                int lru_index = 0;
                for (int j = 1; j < capacity; j++) {
                    if (last_used[j] < last_used[lru_index]) {
                        lru_index = j;
                    }
                }

                replaced_page = frames[lru_index]; // Record evicted page for display
                frames[lru_index] = page;          // Load new page into LRU slot
                last_used[lru_index] = time;       // Update its timestamp
            }
        }

        // ------------------------------------------

        // PRINT CURRENT STEP ROW
        printf("%-d\t%-d\t", time + 1, page);
        for (int j = 0; j < capacity; j++) {
            if (frames[j] == -1) printf("-\t");
            else printf("%d\t", frames[j]);
        }

        if (is_hit) {
            printf("Hit\t-\n");
        } else {
            if (replaced_page != -1) printf("Fault\tPage %d\n", replaced_page);
            else printf("Fault\tNone\n");
        }
    }

    // -------------------------------------------

    // PRINT SUMMARY STATISTICS
    float hit_ratio = ((float)page_hits / n) * 100.0f;
    float miss_ratio = ((float)page_faults / n) * 100.0f;

    printf("\nTotal References : %d\n", n);
    printf("Total Page Faults: %d\n", page_faults);
    printf("Total Page Hits  : %d\n", page_hits);
    printf("Hit Ratio        : %.2f%%\n", hit_ratio);
    printf("Miss Ratio       : %.2f%%\n", miss_ratio);
}

int main(void) {
    // take capacity, reference string length, and page values, then pass them to simulation function

    int capacity, n;
    int pages[MAX_REFS];

    // Ask number of frames
    printf("Enter number of page frames: ");
    if (scanf("%d", &capacity) != 1 || capacity <= 0 || capacity > MAX_FRAMES) return 1;

    // Ask number of page references
    printf("Enter number of page references: ");
    if (scanf("%d", &n) != 1 || n <= 0 || n > MAX_REFS) return 1;

    // Collect page reference values
    printf("Enter %d page reference values: ", n);
    for (int i = 0; i < n; i++) {
        scanf("%d", &pages[i]);
    }

    // Run simulation
    lru_page_replacement(pages, n, capacity);
    return 0;
}
</script>

<script type="text/plain" data-group="C Programs (Input)" data-lang="c" data-title="2. Priority Preemptive (User Input)">
#include <stdio.h>
#include <string.h>

#define MAX_PROC 20          // Max processes array can hold
#define TIMELINE_LEN 500     // Max timeline length for tick-by-tick tracking

void solve(int n, int at[], int bt[], int pr[]) {

    // VARIABLE DECLARE

    // declare all tracking and table metric arrays
    int rem[MAX_PROC];        // Remaining CPU burst time (decrements each tick)
    int ct[MAX_PROC];         // Completion time
    int st[MAX_PROC];         // Start time (first time CPU dispatches the process)
    int pre[MAX_PROC];        // Preemption count tracker

    // declare timeline array to track running process ID at every single time tick
    int tl[TIMELINE_LEN];     

    // declare all variables that track progress and state
    int time = 0;             // System clock starting at 0
    int done = 0;             // Counter for how many processes have finished
    int last = -1;            // Process ID that ran in the previous tick
    int cs = 0;               // Total context switches counter

    // init tracking arrays
    for (int i = 0; i < n; i++) {
        rem[i] = bt[i];       // Remaining time starts equal to burst time
        st[i] = -1;           // -1 means process hasn't started yet
        pre[i] = 0;           // Zero preemptions initially
    }

    // ------------------------------------------

    // TICK-BY-TICK SIMULATION LOOP
    // Runs every single clock tick until all processes are completed
    while (done < n) {
        int cur = -1; // Index of current highest priority process (-1 means none ready)

        // Find arrived process with highest priority (lower number = higher priority)
        // Tie-breaker: if priorities match, pick the one that arrived earlier
        for (int i = 0; i < n; i++) {
            if (at[i] <= time && rem[i] > 0) { // If process has arrived and still has work left
                if (cur == -1 || pr[i] < pr[cur] || (pr[i] == pr[cur] && at[i] < at[cur])) {
                    cur = i;
                }
            }
        }

        // IF NO PROCESS ARRIVED, CPU IS IDLE FOR 1 TIME UNIT
        if (cur == -1) {
            tl[time++] = -1; // -1 represents IDLE state in our timeline array
            last = -1;       // Reset last running process tracker
            continue;
        }

        // DETECT PREEMPTION AND CONTEXT SWITCH
        // If a different process was running last tick, we have a context switch
        if (last != -1 && last != cur) {
            cs++;
            if (rem[last] > 0) {
                pre[last]++; // If the previous process still has work, it was preempted!
            }
        }

        // RECORD FIRST START TIME (for Response Time calculation later)
        if (st[cur] == -1) {
            st[cur] = time; // Records the exact moment the process first touches the CPU
        }

        // EXECUTE PROCESS FOR 1 TIME UNIT
        tl[time++] = cur;   // Log current process ID at this time tick
        rem[cur]--;         // Decrease its remaining burst time by 1
        last = cur;         // Update last running process tracker

        // CHECK IF PROCESS FINISHED EXECUTION
        if (rem[cur] == 0) {
            ct[cur] = time; // Record completion time
            done++;         // Increment completed process count
        }
    }

    // -------------------------------------------

    // PRINT EVERYTHING

    // 1. Render Merged Gantt Chart
    printf("\nGantt Chart:\n");
    for (int t = 0; t < time;) {
        int p = tl[t];
        while (t < time && tl[t] == p) t++;
        if (p == -1) printf("| IDLE ");
        else printf("| P%d ", p + 1);
    }
    printf("|\n0");

    for (int t = 0; t < time;) {
        int p = tl[t];
        while (t < time && tl[t] == p) t++;
        char cell[16];
        if (p == -1) strcpy(cell, "| IDLE ");
        else sprintf(cell, "| P%d ", p + 1);
        printf("%*d", (int)strlen(cell), t);
    }
    printf("\n");

    // 2. Print Per-Process Metrics Table
    printf("\nProc\tAT\tBT\tPriority\tCT\tTAT\tWT\tRT\tPreemptions\n");
    printf("-----------------------------------------------------------------------\n");

    float sum_tat = 0.0f, sum_wt = 0.0f;
    int max_wt = -1, max_rt = -1;
    int max_wt_proc = 0, max_rt_proc = 0;

    for (int i = 0; i < n; i++) {
        int tat = ct[i] - at[i]; // Turnaround Time = Completion Time - Arrival Time
        int wt = tat - bt[i];    // Waiting Time = Turnaround Time - Burst Time
        int rt = st[i] - at[i];    // Response Time = First Start Time - Arrival Time

        printf("P%d\t%d\t%d\t%d\t\t%d\t%d\t%d\t%d\t%d\n",
               i + 1, at[i], bt[i], pr[i], ct[i], tat, wt, rt, pre[i]);

        sum_tat += tat;
        sum_wt += wt;

        // Track maximum waiting time and response time
        if (wt > max_wt) { max_wt = wt; max_wt_proc = i; }
        if (rt > max_rt) { max_rt = rt; max_rt_proc = i; }
    }

    // 3. Print Summary Averages and Extremes
    printf("\nAverage Waiting Time       = %.2f\n", sum_wt / n);
    printf("Average Turnaround Time    = %.2f\n", sum_tat / n);
    printf("Number of Context Switches = %d\n", cs);
    printf("Maximum WT                 = %d -> P%d\n", max_wt, max_wt_proc + 1);
    printf("Maximum RT                 = %d -> P%d\n", max_rt, max_rt_proc + 1);
}

int main(void) {

    // Take number of processes, AT, BT, and Priority, then pass them to solve function

    int n;             // Number of processes entered by user
    int at[MAX_PROC];  // Array to store Arrival Times
    int bt[MAX_PROC];  // Array to store Burst Times
    int pr[MAX_PROC];  // Array to store Priorities

    // Ask number of processes

    if (scanf("%d", &n) != 1 || n <= 0 || n > MAX_PROC) {
        printf("Invalid input.\n");

#include <stdio.h>

#define MAX 20 // max process array can hold

void solve(int n, int at[], int bt[], int pr[]) {

    // VARIABLE DECLARE

    // declare all variables that are in table 
    // CT RT TAT WT Preemptions
    int ct[MAX];
    int rt[MAX];
    int tat[MAX];
    int wt[MAX];
    int pre[MAX]; // preemption count tracker

    // declare all variables to put in gantt chart
    // gantt_pid , gantt_start , gantt_end , gc (ganttchart entry counter)
    int gantt_pid[MAX * 2];
    int gantt_start[MAX * 2];
    int gantt_end[MAX * 2];
    int gc = 0; // counts how many blocks recorded in gantt chart 

    // declare all variables that track progress
    int time = 0;
    int completed = 0;
    int cswitch = 0;
    int done[MAX] = {0}; // done is array cause we need n done flags for n number of processes  

    // extra tracking variables for preemptive execution
    int rem[MAX];        // remaining burst time
    for (int i = 0; i < n; i++) rem[i] = bt[i];
    for (int i = 0; i < n; i++) rt[i] = -1; // -1 to track first start time for RT
    int last_pid = -1;   // tracks process running in previous tick

    // ------------------------------------------

    // TICK-BY-TICK SIMULATION LOOP (Preemptive Priority)
    while (completed < n) {
        int idx = -1;            // index of chosen process (-1 is not assigned yet)
        int min_pr = 99999;      // keep high so lower priority numbers (higher priority) replace it

        // find which process has arrived + which has highest priority (lowest priority number)
        for (int i = 0; i < n; i++) {
            if (!done[i] && at[i] <= time) {
                // check if priority is higher (smaller number)
                if (pr[i] < min_pr || (pr[i] == min_pr && at[i] < at[idx])) {
                    min_pr = pr[i];
                    idx = i;     // process at ith index is now selected
                }
            }
        }

        // IF NO PROCESS ARRIVED, CPU IDLE FOR 1 TIME UNIT
        if (idx == -1) {
            gantt_pid[gc] = -1;  // put idle process (-1) in this gantt block
            gantt_start[gc] = time;
            gantt_end[gc] = time + 1;
            time++;
            gc++;
            last_pid = -1;
            continue;
        }

        // -------------------------------------------------------

        // count context switch and preemption
        if (last_pid != -1 && last_pid != idx) {
            cswitch++;          // switched from a different process
            if (rem[last_pid] > 0) {
                pre[last_pid]++; // previous process was interrupted before finishing
            }
        }

        // record response time on first execution touch
        if (rt[idx] == -1) {
            rt[idx] = time - at[idx];
        }

        // execute process for 1 time unit (tick)
        gantt_pid[gc] = idx;
        gantt_start[gc] = time;

        time++;                 // advance system clock by 1 tick
        rem[idx]--;             // decrease remaining burst time by 1

        gantt_end[gc] = time;   // end time of this 1-tick block
        gc++;                   // move to next gantt slot
        last_pid = idx;         // update last running process

        // check if process finished execution
        if (rem[idx] == 0) {
            ct[idx] = time;
            tat[idx] = ct[idx] - at[idx];
            wt[idx] = tat[idx] - bt[idx];
            done[idx] = 1;
            completed++;
        }
    }

    // -------------------------------------------

    // PRINT EVERYTHING 

    // 1. Print Top Border
    printf("\nGantt Chart:\n+");
    for (int i = 0; i < gc; i++) printf("------+");

    // 2. Print Process Names / IDLE inside boxes
    printf("\n|");
    for (int i = 0; i < gc; i++) {
        if (gantt_pid[i] == -1) {
            printf(" IDLE |");
        }
        else {
            printf("  P%-d |", gantt_pid[i] + 1);
        } 
    }

    // 3. Print Bottom Border
    printf("\n+");
    for (int i = 0; i < gc; i++) printf("------+");

    // 4. Print Timeline Numbers underneath
    printf("\n%-d", gantt_start[0]);
    for (int i = 0; i < gc; i++) {
        printf("   %-d", gantt_end[i]);
    }
    printf("\n");

    // Print process metrics table cleanly using tabs
    printf("\nProcess\tAT\tBT\tPriority\tCT\tRT\tTAT\tWT\tPreempt\n");
    printf("-------------------------------------------------------------------\n");

    float sum_wt = 0.0f, sum_tat = 0.0f;
    for (int i = 0; i < n; i++) {
        printf("P%d\t%d\t%d\t%d\t\t%d\t%d\t%d\t%d\t%d\n",
               i + 1, at[i], bt[i], pr[i], ct[i], rt[i], tat[i], wt[i], pre[i]);
        sum_wt += wt[i];
        sum_tat += tat[i];
    }

    // Print Summary Averages & Context Switches
    printf("\nAverage Waiting Time       = %.2f\n", sum_wt / n);
    printf("Average Turnaround Time    = %.2f\n", sum_tat / n); 
    printf("Number of Context Switches = %d\n", cswitch);
}

int main(void) {
    // take num of process, AT, BT, and Priority for those process and pass them to solve function

    int n;             // no of process by user
    int at[MAX];       // array to store AT
    int bt[MAX];       // array to store BT
    int pr[MAX];       // array to store Priority

    // ask number of process
    printf("Enter number of processes: ");
    if (scanf("%d", &n) != 1 || n <= 0 || n > MAX) {
        printf("Invalid input.\n");
        return 1;
    }

    // collect AT, BT, and Priority
    for (int i = 0; i < n; i++) {
        printf("Enter AT, BT, and Priority (1 is highest) for P%d: ", i + 1);
        scanf("%d %d %d", &at[i], &bt[i], &pr[i]);    
    }

    // solve
    solve(n, at, bt, pr);
    return 0;
}

#include <stdio.h>

#define MAX_PROCESS 10
#define MAX_RESOURCE 10

void bankers(int processes, int resources, int allocation[MAX_PROCESS][MAX_RESOURCE], int max[MAX_PROCESS][MAX_RESOURCE], int available[MAX_RESOURCE])
{

    // VARIABLE DECLARE
    int need[MAX_PROCESS][MAX_RESOURCE]; // Need matrix = Max demand - Allocation
    int work[MAX_RESOURCE];              // Work vector to track available resources during simulation
    int finish[MAX_PROCESS] = {0};       // Finish array (0 = process not finished, 1 = finished safely)
    int safe_seq[MAX_PROCESS];           // Array to store the safe execution sequence

    int finished = 0; // Counts how many processes have successfully finished
    int safe = 1;     // Flag to track if progress was made in the safety loop

    // COMPUTE NEED MATRIX (Need = Max - Allocation)
    for (int i = 0; i < processes; i++)
    {
        for (int j = 0; j < resources; j++)
        {
            need[i][j] = max[i][j] - allocation[i][j];
        }
    }

    // PRINT NEED MATRIX cleanly using tabs
    printf("\nNeed Matrix:\nProcess\t");
    for (int j = 0; j < resources; j++)
    {
        printf("R%-d\t", j + 1); // Fixed: print R1, R2, etc. based on column index
    }
    printf("\n----------------------------------------\n");
    for (int i = 0; i < processes; i++)
    {
        printf("P%d\t", i + 1);
        for (int j = 0; j < resources; j++)
        {
            printf("%d\t", need[i][j]);
        }
        printf("\n");
    }

    // ----------------------------------

    // SAFETY CHECK ALGORITHM

    // Copy available resources to work vector
    for (int j = 0; j < resources; j++)
    {
        work[j] = available[j];
    }

    // Safety simulation loop
    while (safe)
    {
        safe = 0; // Assume no process can run in this pass until proven otherwise

        for (int i = 0; i < processes; i++)
        {
            // If process hasn't finished yet
            if (!finish[i])
            {
                int can_allocate = 1; // Flag to check if resources are sufficient

                // Check if all needed resources are less than or equal to available work
                for (int j = 0; j < resources; j++)
                {
                    if (need[i][j] > work[j])
                    {
                        can_allocate = 0;
                        break;
                    }
                }

                // If feasible, simulate execution, reclaim allocated resources, and mark finished
                if (can_allocate)
                {
                    for (int j = 0; j < resources; j++)
                    {
                        work[j] += allocation[i][j]; // Fixed: add allocated resources back to work pool
                    }
                    finish[i] = 1;            // Mark process as finished safely
                    safe_seq[finished++] = i; // Record process index in safe sequence
                    safe = 1;                 // Set progress flag to 1 so while loop continues
                }
            }
        }
    }

    // PRINT RESULTS AND SAFE SEQUENCE
    if (finished == processes)
    {
        printf("\nResult: System is in a SAFE State\nSafe Sequence: ");
        for (int i = 0; i < processes; i++)
        {
            if (i > 0)
                printf(" -> ");
            printf("P%d", safe_seq[i] + 1); // Match 1-based indexing for display
        }
        printf("\n");
    }
    else
    {
        printf("\nResult: System is NOT in a safe state (Deadlock potential).\n");
    }
}

int main(void)
{
    int processes; // Number of processes
    int resources; // Number of resource types

    int allocation[MAX_PROCESS][MAX_RESOURCE];
    int max_need[MAX_PROCESS][MAX_RESOURCE];
    int available[MAX_RESOURCE];

    // Ask number of processes and resources
    printf("Enter number of processes: ");
    scanf("%d", &processes); // Fixed: added &

    printf("Enter number of resource types: ");
    scanf("%d", &resources); // Fixed: added &

    // Collect allocation matrix
    printf("Enter Allocation Matrix (%d x %d):\n", processes, resources);
    for (int i = 0; i < processes; i++)
    {
        for (int j = 0; j < resources; j++)
        {
            scanf("%d", &allocation[i][j]);
        }
    }

    // Collect max demand matrix
    printf("Enter Max Demand Matrix (%d x %d):\n", processes, resources);
    for (int i = 0; i < processes; i++)
    {
        for (int j = 0; j < resources; j++)
        {
            scanf("%d", &max_need[i][j]);
        }
    }

    // Collect available resources vector
    printf("Enter Available Resources (%d values): ", resources);
    for (int j = 0; j < resources; j++)
    {
        scanf("%d", &available[j]);
    }

    // Pass all required matrices and vectors to bankers function
    bankers(processes, resources, allocation, max_need, available);

    return 0;
}

#include <stdio.h>

#define MAX_FRAMES 10  // Max frames array can hold
#define MAX_REFS 100   // Max page reference string length

void lru_page_replacement(int pages[], int n, int capacity) {

    // VARIABLE DECLARE

    // declare all tracking arrays for frames and access timestamps
    int frames[MAX_FRAMES];      // Stores page numbers currently loaded in memory
    int last_used[MAX_FRAMES];   // Stores the timestamp/time of last access for each frame

    // declare all variables that track progress and statistics
    int frame_count = 0;         // Number of currently occupied frames
    int page_faults = 0;         // Total page fault counter
    int page_hits = 0;           // Total page hit counter

    // Initialize all frames and timestamps to -1 (meaning empty)
    for (int i = 0; i < capacity; i++) {
        frames[i] = -1;
        last_used[i] = -1;
    }

    // ------------------------------------------

    // PRINT TABLE HEADER
  // Print table header cleanly
    printf("\nStep\tPage\t");
    for (int i = 0; i < capacity; i++) {
        printf("F%d\t", i + 1);
    }
    printf("Status\tEvicted\n");
    printf("-------------------------------------------------------------------\n");
    // ------------------------------------------

    // SIMULATION LOOP: Process each page reference step-by-step over time
    for (int time = 0; time < n; time++) {
        int page = pages[time];       // Current page being referenced
        int pos = -1;                 // Position if found in frames (-1 means not found)
        int is_hit = 0;               // Flag for hit (1) or fault (0)
        int replaced_page = -1;       // Tracks which page was evicted during a fault

        // CHECK IF PAGE IS ALREADY IN MEMORY (PAGE HIT)
        for (int j = 0; j < frame_count; j++) {
            if (frames[j] == page) {
                pos = j;
                break;
            }
        }

        // HANDLE HIT OR FAULT
        if (pos != -1) {
            // PAGE HIT: Page is already in memory, update its last used timestamp
            last_used[pos] = time;
            page_hits++;
            is_hit = 1;
        } else {
            // PAGE FAULT: Page is not in memory, needs to be brought in
            page_faults++;

            // Case A: There is still an empty frame available
            if (frame_count < capacity) {
                frames[frame_count] = page;
                last_used[frame_count] = time;
                frame_count++;
            } 
            // Case B: Memory is full, must replace Least Recently Used (LRU) page
            else {
                // Find frame with the smallest last_used time (oldest access)
                int lru_index = 0;
                for (int j = 1; j < capacity; j++) {
                    if (last_used[j] < last_used[lru_index]) {
                        lru_index = j;
                    }
                }

                replaced_page = frames[lru_index]; // Record evicted page for display
                frames[lru_index] = page;          // Load new page into LRU slot
                last_used[lru_index] = time;       // Update its timestamp
            }
        }

        // ------------------------------------------

        // PRINT CURRENT STEP ROW
        printf("%-d\t%-d\t", time + 1, page);
        for (int j = 0; j < capacity; j++) {
            if (frames[j] == -1) printf("-\t");
            else printf("%d\t", frames[j]);
        }

        if (is_hit) {
            printf("Hit\t-\n");
        } else {
            if (replaced_page != -1) printf("Fault\tPage %d\n", replaced_page);
            else printf("Fault\tNone\n");
        }
    }

    // -------------------------------------------

    // PRINT SUMMARY STATISTICS
    float hit_ratio = ((float)page_hits / n) * 100.0f;
    float miss_ratio = ((float)page_faults / n) * 100.0f;

    printf("\nTotal References : %d\n", n);
    printf("Total Page Faults: %d\n", page_faults);
    printf("Total Page Hits  : %d\n", page_hits);
    printf("Hit Ratio        : %.2f%%\n", hit_ratio);
    printf("Miss Ratio       : %.2f%%\n", miss_ratio);
}

int main(void) {
    // HARDCODED INPUT: edit these values to test other cases
    int capacity = 3;                                            // number of page frames
    int pages[] = {7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2};       // page reference string
    int n = sizeof(pages) / sizeof(pages[0]);                    // number of references

    printf("Page frames: %d\n", capacity);

    // Run simulation
    lru_page_replacement(pages, n, capacity);
    return 0;
}

               i + 1, at[i], bt[i], pr[i], ct[i], tat, wt, rt, pre[i]);

        sum_tat += tat;
        sum_wt += wt;

        // Track maximum waiting time and response time
        if (wt > max_wt) { max_wt = wt; max_wt_proc = i; }
        if (rt > max_rt) { max_rt = rt; max_rt_proc = i; }
    }

    // 3. Print Summary Averages and Extremes
    printf("\nAverage Waiting Time       = %.2f\n", sum_wt / n);
    printf("Average Turnaround Time    = %.2f\n", sum_tat / n);
    printf("Number of Context Switches = %d\n", cs);
    printf("Maximum WT                 = %d -> P%d\n", max_wt, max_wt_proc + 1);
    printf("Maximum RT                 = %d -> P%d\n", max_rt, max_rt_proc + 1);
}

<script type="text/plain" data-group="C Programs (Hardcoded)" data-lang="c" data-title="3. SJF (Hardcoded)">
#include <stdio.h>

#define MAX 20 // max process array can hold

void solve(int n, int at[], int bt[], int pr[]) {

    // VARIABLE DECLARE

    // declare all variables that are in table 
    // CT RT TAT WT Preemptions
    int ct[MAX];
    int rt[MAX];
    int tat[MAX];
    int wt[MAX];
    int pre[MAX]; // preemption count tracker

    // declare all variables to put in gantt chart
    // gantt_pid , gantt_start , gantt_end , gc (ganttchart entry counter)
    int gantt_pid[MAX * 2];
    int gantt_start[MAX * 2];
    int gantt_end[MAX * 2];
    int gc = 0; // counts how many blocks recorded in gantt chart 

    // declare all variables that track progress
    int time = 0;
    int completed = 0;
    int cswitch = 0;
    int done[MAX] = {0}; // done is array cause we need n done flags for n number of processes  

    // extra tracking variables for preemptive execution
    int rem[MAX];        // remaining burst time
    for (int i = 0; i < n; i++) rem[i] = bt[i];
    for (int i = 0; i < n; i++) rt[i] = -1; // -1 to track first start time for RT
    for (int i = 0; i < n; i++) pre[i] = 0;  // init preemption counters
    int last_pid = -1;   // tracks process running in previous tick

    // ------------------------------------------

    // TICK-BY-TICK SIMULATION LOOP (Preemptive Priority)
    while (completed < n) {
        int idx = -1;            // index of chosen process (-1 is not assigned yet)
        int min_pr = 99999;      // keep high so lower priority numbers (higher priority) replace it

        // find which process has arrived + which has highest priority (lowest priority number)
        for (int i = 0; i < n; i++) {
            if (!done[i] && at[i] <= time) {
                // check if priority is higher (smaller number)
                if (pr[i] < min_pr || (pr[i] == min_pr && at[i] < at[idx])) {
                    min_pr = pr[i];
                    idx = i;     // process at ith index is now selected
                }
            }
        }

        // IF NO PROCESS ARRIVED, CPU IDLE FOR 1 TIME UNIT
        if (idx == -1) {
            gantt_pid[gc] = -1;  // put idle process (-1) in this gantt block
            gantt_start[gc] = time;
            gantt_end[gc] = time + 1;
            time++;
            gc++;
            last_pid = -1;
            continue;
        }

        // -------------------------------------------------------

        // count context switch and preemption
        if (last_pid != -1 && last_pid != idx) {
            cswitch++;          // switched from a different process
            if (rem[last_pid] > 0) {
                pre[last_pid]++; // previous process was interrupted before finishing
            }
        }

        // record response time on first execution touch
        if (rt[idx] == -1) {
            rt[idx] = time - at[idx];
        }

        // execute process for 1 time unit (tick)
        gantt_pid[gc] = idx;
        gantt_start[gc] = time;

        time++;                 // advance system clock by 1 tick
        rem[idx]--;             // decrease remaining burst time by 1

        gantt_end[gc] = time;   // end time of this 1-tick block
        gc++;                   // move to next gantt slot
        last_pid = idx;         // update last running process

        // check if process finished execution
        if (rem[idx] == 0) {
            ct[idx] = time;
            tat[idx] = ct[idx] - at[idx];
            wt[idx] = tat[idx] - bt[idx];
            done[idx] = 1;
            completed++;
        }
    }

    // -------------------------------------------

    // PRINT EVERYTHING 

    // 1. Print Top Border
    printf("\nGantt Chart:\n+");
    for (int i = 0; i < gc; i++) printf("------+");

    // 2. Print Process Names / IDLE inside boxes
    printf("\n|");
    for (int i = 0; i < gc; i++) {
        if (gantt_pid[i] == -1) {
            printf(" IDLE |");
        }
        else {
            printf("  P%-d |", gantt_pid[i] + 1);
        } 
    }

    // 3. Print Bottom Border
    printf("\n+");
    for (int i = 0; i < gc; i++) printf("------+");

    // 4. Print Timeline Numbers underneath
    printf("\n%-d", gantt_start[0]);
    for (int i = 0; i < gc; i++) {
        printf("   %-d", gantt_end[i]);
    }
    printf("\n");

    // Print process metrics table cleanly using tabs
    printf("\nProcess\tAT\tBT\tPriority\tCT\tRT\tTAT\tWT\tPreempt\n");
    printf("-------------------------------------------------------------------\n");

    float sum_wt = 0.0f, sum_tat = 0.0f;
    for (int i = 0; i < n; i++) {
        printf("P%d\t%d\t%d\t%d\t\t%d\t%d\t%d\t%d\t%d\n",
               i + 1, at[i], bt[i], pr[i], ct[i], rt[i], tat[i], wt[i], pre[i]);
        sum_wt += wt[i];
        sum_tat += tat[i];
    }

    // Print Summary Averages & Context Switches
    printf("\nAverage Waiting Time       = %.2f\n", sum_wt / n);
    printf("Average Turnaround Time    = %.2f\n", sum_tat / n); 
    printf("Number of Context Switches = %d\n", cswitch);
}

int main(void) {
    // HARDCODED INPUT: edit these values to test other cases
    // Priority: 1 is highest
    int n = 4;                          // no of process
    int at[MAX] = {0, 1, 2, 3};         // Arrival Times
    int bt[MAX] = {6, 4, 3, 2};         // Burst Times
    int pr[MAX] = {3, 1, 4, 2};         // Priorities

    // solve
    solve(n, at, bt, pr);
    return 0;
}
</script>

<script type="text/plain" data-group="C Programs (Hardcoded)" data-lang="c" data-title="4. Banker's Algorithm (Hardcoded)">
#include <stdio.h>

#define MAX_PROCESS 10
#define MAX_RESOURCE 10

void bankers(int processes, int resources, int allocation[MAX_PROCESS][MAX_RESOURCE], int max[MAX_PROCESS][MAX_RESOURCE], int available[MAX_RESOURCE])
{

    // VARIABLE DECLARE
    int need[MAX_PROCESS][MAX_RESOURCE]; // Need matrix = Max demand - Allocation
    int work[MAX_RESOURCE];              // Work vector to track available resources during simulation
    int finish[MAX_PROCESS] = {0};       // Finish array (0 = process not finished, 1 = finished safely)
    int safe_seq[MAX_PROCESS];           // Array to store the safe execution sequence

    int finished = 0; // Counts how many processes have successfully finished
    int safe = 1;     // Flag to track if progress was made in the safety loop

    // COMPUTE NEED MATRIX (Need = Max - Allocation)
    for (int i = 0; i < processes; i++)
    {
        for (int j = 0; j < resources; j++)
        {
            need[i][j] = max[i][j] - allocation[i][j];
        }
    }

    // PRINT NEED MATRIX cleanly using tabs
    printf("\nNeed Matrix:\nProcess\t");
    for (int j = 0; j < resources; j++)
    {
        printf("R%-d\t", j + 1); // Fixed: print R1, R2, etc. based on column index
    }
    printf("\n----------------------------------------\n");
    for (int i = 0; i < processes; i++)
    {
        printf("P%d\t", i + 1);
        for (int j = 0; j < resources; j++)
        {
            printf("%d\t", need[i][j]);
        }
        printf("\n");
    }

    // ----------------------------------

    // SAFETY CHECK ALGORITHM

    // Copy available resources to work vector
    for (int j = 0; j < resources; j++)
    {
        work[j] = available[j];
    }

    // Safety simulation loop
    while (safe)
    {
        safe = 0; // Assume no process can run in this pass until proven otherwise

        for (int i = 0; i < processes; i++)
        {
            // If process hasn't finished yet
            if (!finish[i])
            {
                int can_allocate = 1; // Flag to check if resources are sufficient

                // Check if all needed resources are less than or equal to available work
                for (int j = 0; j < resources; j++)
                {
                    if (need[i][j] > work[j])
                    {
                        can_allocate = 0;
                        break;
                    }
                }

                // If feasible, simulate execution, reclaim allocated resources, and mark finished
                if (can_allocate)
                {
                    for (int j = 0; j < resources; j++)
                    {
                        work[j] += allocation[i][j]; // Fixed: add allocated resources back to work pool
                    }
                    finish[i] = 1;            // Mark process as finished safely
                    safe_seq[finished++] = i; // Record process index in safe sequence
                    safe = 1;                 // Set progress flag to 1 so while loop continues
                }
            }
        }
    }

    // PRINT RESULTS AND SAFE SEQUENCE
    if (finished == processes)
    {
        printf("\nResult: System is in a SAFE State\nSafe Sequence: ");
        for (int i = 0; i < processes; i++)
        {
            if (i > 0)
                printf(" -> ");
            printf("P%d", safe_seq[i] + 1); // Match 1-based indexing for display
        }
        printf("\n");
    }
    else
    {
        printf("\nResult: System is NOT in a safe state (Deadlock potential).\n");
    }
}

int main(void)
{
    // HARDCODED INPUT: edit these values to test other cases
    int processes = 5; // Number of processes
    int resources = 3; // Number of resource types

    int allocation[MAX_PROCESS][MAX_RESOURCE] = {
        {0, 1, 0},
        {2, 0, 0},
        {3, 0, 2},
        {2, 1, 1},
        {0, 0, 2}
    };

    int max_need[MAX_PROCESS][MAX_RESOURCE] = {
        {7, 5, 3},
        {3, 2, 2},
        {9, 0, 2},
        {2, 2, 2},
        {4, 3, 3}
    };

    int available[MAX_RESOURCE] = {3, 3, 2};

    // Pass all required matrices and vectors to bankers function
    bankers(processes, resources, allocation, max_need, available);

    return 0;
}

  var saved = null;
  try { saved = localStorage.getItem("codeRefTheme"); } catch (e) {}
  setTheme(saved === "dark" ? "dark" : "light");

  /* ---------- File browser nav buttons ---------- */
  function visibleSections() {
    return sections.filter(function (s) { return !s.card.classList.contains("hidden"); });
  }
  function step(d) {
    var v = visibleSections();
    var i = -1;
    v.forEach(function (s, k) { if (s.link.classList.contains("active")) i = k; });
    var n = v[Math.min(v.length - 1, Math.max(0, i + d))];
    if (n) show(n.data.id);
  }
  document.getElementById("navBack").addEventListener("click", function () { step(-1); });
  document.getElementById("navFwd").addEventListener("click", function () { step(1); });
  document.getElementById("navUp").addEventListener("click", function () { if (current) current.card.querySelector(".code-wrap").scrollTo({ top: 0, behavior: "smooth" }); });
  document.getElementById("openArrow").addEventListener("click", function () {
    var fs = tree.querySelectorAll(".folder");
    var anyOpen = Array.prototype.some.call(fs, function (f) { return !f.classList.contains("collapsed"); });
    fs.forEach(function (f) { f.classList.toggle("collapsed", anyOpen); });
  });

  /* ---------- Header buttons ---------- */
  var menuPop = document.getElementById("menuPop");
  document.getElementById("menuBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    menuPop.hidden = !menuPop.hidden;
  });
  document.addEventListener("click", function (e) {
    if (!menuPop.contains(e.target)) menuPop.hidden = true;
  });
  menuPop.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "theme") setTheme(b.getAttribute("data-theme-opt"));
    else if (act === "copy") { if (current) copyText(current.data.code, "Copied: " + current.data.title); }
    else if (act === "copyall") copyAllCodes();
    menuPop.hidden = true;
  });
  document.getElementById("openBtn").addEventListener("click", function () {
    if (window.innerWidth <= 800) side.classList.add("open");
    document.body.classList.remove("sb-hidden");
    q.focus();
  });
  document.getElementById("sidebarBtn").addEventListener("click", function () {
    if (window.innerWidth <= 800) side.classList.toggle("open");
    else document.body.classList.toggle("sb-hidden");
  });
  document.getElementById("saveBtn").addEventListener("click", function () {
    if (!current) return;
    var name = current.data.title.replace(/^\d+\.\s*/, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") +
      (current.data.lang === "c" ? ".c" : ".sh");
    var url = URL.createObjectURL(new Blob([current.data.code], { type: "text/plain" }));
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 500);
    showToast("Saved " + name);
  });
  document.getElementById("closeBtn").addEventListener("click", function () {
    q.value = "";
    applySearch();
    show(sections[0].data.id);
  });

  /* ---------- Find box: jump between matches ---------- */
  var matches = [], mi = -1, findDismissed = false;
  var findBox = document.getElementById("findBox");
  var findInput = document.getElementById("findInput");
  var findCount = document.getElementById("findCount");

  function markLine(el, term) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    var nodes = [], any = false;
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (n) {
      var t = n.nodeValue, low = t.toLowerCase(), i = low.indexOf(term);
      if (i < 0) return;
      var frag = document.createDocumentFragment(), last = 0;
      while (i >= 0) {
        frag.appendChild(document.createTextNode(t.slice(last, i)));
        var m = document.createElement("mark");
        m.className = "m";
        m.textContent = t.slice(i, i + term.length);
        frag.appendChild(m);
        any = true;
        last = i + term.length;
        i = low.indexOf(term, last);
      }
      frag.appendChild(document.createTextNode(t.slice(last)));
      n.parentNode.replaceChild(frag, n);
    });
    return any;
  }

  function reveal(el, sec) {
    var wrap = sec.card.querySelector(".code-wrap");
    var r = el.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    wrap.scrollTop += (r.top - w.top) - w.height / 2;
    if (r.left < w.left + 90 || r.right > w.right - 330) wrap.scrollLeft += (r.left - w.left) - 160;
  }

  function updateFindUI() {
    var term = q.value.trim();
    var visible = term && !findDismissed && (matches.length > 1 || document.activeElement === findInput);
    findBox.hidden = !visible;
    if (!matches.length) { findCount.textContent = term ? "No matches" : ""; return; }
    var secs = {}, n = 0;
    matches.forEach(function (m) { if (!secs[m.sec.data.id]) { secs[m.sec.data.id] = 1; n++; } });
    findCount.textContent = (mi + 1) + " of " + matches.length + " matches" + (n > 1 ? " in " + n + " programs" : "");
  }

  function go(i) {
    if (!matches.length) return;
    i = (i + matches.length) % matches.length;
    var t = matches[i];
    if (t.sec !== current) show(t.sec.data.id);
    if (mi >= 0 && matches[mi]) matches[mi].el.classList.remove("cur");
    mi = i;
    t.el.classList.add("cur");
    reveal(t.el, t.sec);
    updateFindUI();
  }

  function rebuildMatches(term) {
    findDismissed = false;
    matches = [];
    mi = -1;
    if (term) {
      sections.forEach(function (s) {
        if (s.card.classList.contains("hidden")) return;
        s.card.querySelectorAll("mark.m").forEach(function (m) { matches.push({ sec: s, el: m }); });
      });
    }
    if (document.activeElement !== findInput) findInput.value = q.value;
    if (matches.length) {
      var idx = 0;
      for (var i = 0; i < matches.length; i++) {
        if (current && matches[i].sec === current) { idx = i; break; }
      }
      go(idx);
    }
    updateFindUI();
  }

  function syncFindToCurrent() {
    if (!matches.length || !current) return;
    if (mi >= 0 && matches[mi] && matches[mi].sec === current) return;
    for (var i = 0; i < matches.length; i++) {
      if (matches[i].sec === current) {
        if (mi >= 0 && matches[mi]) matches[mi].el.classList.remove("cur");
        mi = i;
        matches[i].el.classList.add("cur");
        updateFindUI();
        break;
      }
    }
  }

  document.getElementById("findNext").addEventListener("click", function () { go(mi + 1); });
  document.getElementById("findPrev").addEventListener("click", function () { go(mi - 1); });
  document.getElementById("findClose").addEventListener("click", function () { findDismissed = true; updateFindUI(); });
  findInput.addEventListener("input", function () { q.value = findInput.value; applySearch(); });
  findInput.addEventListener("focus", updateFindUI);
  findInput.addEventListener("blur", function () { setTimeout(updateFindUI, 0); });
  [q, findInput].forEach(function (inp) {
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (matches.length) go(mi + (e.shiftKey ? -1 : 1));
      } else if (e.key === "Escape" && inp === findInput) {
        findDismissed = true;
        findInput.blur();
        updateFindUI();
      }
    });
  });

  /* ---------- Show one program at a time ---------- */
  var current = null;
  function show(id) {
    var t = null;
    sections.forEach(function (s) { if (s.data.id === id) t = s; });
    if (!t) return;
    sections.forEach(function (s) {
      var on = s === t;
      s.card.classList.toggle("current", on);
      s.link.classList.toggle("active", on);
    });
    current = t;
    document.getElementById("hbName").textContent = t.data.title;
    document.getElementById("hbPath").textContent = "~/" + t.data.group.toLowerCase().replace(/\s*\(([^)]*)\)/, "/$1").replace(/[^a-z0-9\/]+/g, "-");
    var wrap = t.card.querySelector(".code-wrap");
    wrap.scrollTop = 0;
    wrap.scrollLeft = 0;
    var firstHit = t.card.querySelector(".line.hit");
    if (firstHit) wrap.scrollTop = Math.max(0, firstHit.offsetTop - 80);
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
    syncFindToCurrent();
  }
  var startId = (location.hash || "").slice(1);
  var okStart = sections.some(function (s) { return s.data.id === startId; });
  show(okStart ? startId : sections[0].data.id);
})();
</script>
</body>
</html>
